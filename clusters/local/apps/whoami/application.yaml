apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: whoami
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/amanirshad/aegis-gitops.git
    targetRevision: main
    path: clusters/local/apps/whoami

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true