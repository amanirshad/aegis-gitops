apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: prometheus-crds
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  project: default

  source:
    repoURL: https://github.com/amanirshad/aegis-gitops.git
    targetRevision: main
    path: clusters/local/observability/components/prometheus-crds

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true